
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JOHAR KISAN - Add Machine</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#edf5ed;color:#17351e}
header{background:#176b35;color:white;padding:18px}
main{max-width:600px;margin:auto;padding:15px}
.card{background:white;padding:18px;border-radius:14px}
h2{margin-top:0;color:#176b35}
label{display:block;margin-top:13px;font-weight:bold}
input,select,textarea{
width:100%;padding:12px;margin-top:6px;
border:1px solid #ccd8cc;border-radius:8px;font-size:15px
}
button{
width:100%;padding:13px;margin-top:18px;
border:0;border-radius:9px;background:#176b35;
color:white;font-size:16px
}
button:disabled{opacity:.6}
.gps-btn{background:#245f9e}
#message{margin-top:14px;overflow-wrap:anywhere}
#preview{
width:100%;max-height:220px;object-fit:contain;
margin-top:12px;border-radius:10px;display:none
}
.hint{font-size:13px;color:#607360;line-height:1.5}
#gpsStatus{font-size:14px;color:#176b35;margin-top:9px}
</style>
</head>

<body>

<header>
<h2>🌾 JOHAR KISAN</h2>
<p>अपनी मशीन जोड़ें</p>
</header>

<main>
<div class="card">

<h2>🚜 Add Machine</h2>

<form id="machineForm">

<label>मशीन का नाम</label>
<input id="name" required placeholder="जैसे Tractor">

<label>मशीन की श्रेणी</label>
<select id="category" required disabled>
<option value="">Categories लोड हो रही हैं...</option>
</select>
<p class="hint">यह सूची Admin द्वारा बनाई गई Active Categories से आती है।</p>

<label>मशीन का विवरण</label>
<textarea id="description" placeholder="मशीन की जानकारी"></textarea>

<label>किराया</label>
<input id="price" type="number" min="0" required placeholder="रुपये में">

<label>किराये की इकाई</label>
<select id="price_unit" required>
<option value="">चुनें</option>
<option value="hour">प्रति घंटा</option>
<option value="day">प्रति दिन</option>
<option value="acre">प्रति एकड़</option>
</select>

<label>राज्य</label>
<input id="state" required placeholder="राज्य">

<label>जिला</label>
<input id="district" required placeholder="जिला">

<label>तहसील</label>
<input id="tehsil" placeholder="तहसील">

<label>गाँव / शहर</label>
<input id="village" required placeholder="गाँव या शहर">

<label>मोहल्ला / क्षेत्र</label>
<input id="locality" placeholder="क्षेत्र का नाम">

<hr style="margin-top:20px;border:0;border-top:1px solid #ddd">

<h3>📍 Machine GPS Location</h3>

<p class="hint">
मशीन के काम करने वाले क्षेत्र की लोकेशन दें।
अपना घर का सटीक पता सार्वजनिक लोकेशन के रूप में न दें।
</p>

<button type="button" class="gps-btn" id="gpsBtn">
📍 मेरी लोकेशन प्राप्त करें
</button>

<p id="gpsStatus">GPS Location अभी प्राप्त नहीं हुई है।</p>

<label>मशीन की फोटो Upload करें</label>
<input id="photo" type="file"
accept="image/jpeg,image/png,image/webp">

<img id="preview" alt="Machine photo preview">

<button type="submit" id="saveBtn" disabled>
मशीन सेव करें
</button>

</form>

<p id="message">Categories लोड हो रही हैं...</p>

</div>
</main>

<script type="module">
import {supabase} from "./supabase-config.js";

const form=document.getElementById("machineForm");
const message=document.getElementById("message");
const saveBtn=document.getElementById("saveBtn");
const photoInput=document.getElementById("photo");
const preview=document.getElementById("preview");
const categorySelect=document.getElementById("category");
const gpsBtn=document.getElementById("gpsBtn");
const gpsStatus=document.getElementById("gpsStatus");

let selectedPhoto=null;
let categoriesLoaded=false;

let machineLatitude=null;
let machineLongitude=null;

async function loadCategories(){

 categorySelect.disabled=true;
 categorySelect.innerHTML=
 '<option value="">Categories लोड हो रही हैं...</option>';

 const {data,error}=await supabase
  .from("categories")
  .select("id,name")
  .eq("is_active",true)
  .order("name");

 if(error){
  categorySelect.innerHTML=
  '<option value="">Categories लोड नहीं हुईं</option>';
  message.textContent="Category Error: "+error.message;
  return;
 }

 categorySelect.innerHTML=
 '<option value="">श्रेणी चुनें</option>';

 if(!data || data.length===0){
  categorySelect.innerHTML=
  '<option value="">अभी कोई Active Category नहीं है</option>';
  message.textContent="Admin से Categories जोड़ने का अनुरोध करें।";
  categoriesLoaded=false;
  return;
 }

 data.forEach(category=>{
  const option=document.createElement("option");
  option.value=category.name;
  option.textContent=category.name;
  categorySelect.appendChild(option);
 });

 categorySelect.disabled=false;
 categoriesLoaded=true;
 saveBtn.disabled=false;
 message.textContent="Categories सफलतापूर्वक लोड हो गईं।";
}


// GPS LOCATION
gpsBtn.addEventListener("click",()=>{

 if(!navigator.geolocation){
  gpsStatus.textContent="इस Browser में GPS उपलब्ध नहीं है।";
  return;
 }

 gpsBtn.disabled=true;
 gpsBtn.textContent="लोकेशन प्राप्त हो रही है...";
 gpsStatus.textContent="कृपया Location Permission Allow करें।";

 navigator.geolocation.getCurrentPosition(

  (position)=>{

   machineLatitude=position.coords.latitude;
   machineLongitude=position.coords.longitude;

   gpsStatus.textContent=
    "✅ GPS Location प्राप्त हो गई। अनुमानित Accuracy: "+
    Math.round(position.coords.accuracy)+" मीटर।";

   gpsBtn.textContent="लोकेशन फिर से प्राप्त करें";
   gpsBtn.disabled=false;
  },

  (error)=>{

   machineLatitude=null;
   machineLongitude=null;

   let errorMessage="GPS Location प्राप्त नहीं हुई।";

   if(error.code===1){
    errorMessage="Location Permission Allow करें।";
   }else if(error.code===2){
    errorMessage="GPS Location उपलब्ध नहीं है।";
   }else if(error.code===3){
    errorMessage="GPS में समय लग रहा है। फिर कोशिश करें।";
   }

   gpsStatus.textContent="⚠️ "+errorMessage;
   gpsBtn.textContent="📍 फिर से लोकेशन प्राप्त करें";
   gpsBtn.disabled=false;
  },

  {
   enableHighAccuracy:false,
   timeout:20000,
   maximumAge:60000
  }
 );
});


photoInput.addEventListener("change",()=>{
 selectedPhoto=photoInput.files[0]||null;
 preview.style.display="none";

 if(!selectedPhoto)return;

 const allowed=["image/jpeg","image/png","image/webp"];

 if(!allowed.includes(selectedPhoto.type)){
  message.textContent="केवल JPG, PNG या WEBP फोटो चुनें।";
  photoInput.value="";
  selectedPhoto=null;
  return;
 }

 if(selectedPhoto.size>5*1024*1024){
  message.textContent="फोटो का आकार 5 MB से कम रखें।";
  photoInput.value="";
  selectedPhoto=null;
  return;
 }

 preview.src=URL.createObjectURL(selectedPhoto);
 preview.style.display="block";
 message.textContent="फोटो चुन ली गई है।";
});


form.addEventListener("submit",async(e)=>{

 e.preventDefault();

 if(!categoriesLoaded || !categorySelect.value){
  message.textContent="पहले Active Category चुनें।";
  return;
 }

 saveBtn.disabled=true;
 gpsBtn.disabled=true;

 let uploadedPath=null;

 try{

  message.textContent="जानकारी सेव हो रही है...";

  const {data,error:authError}=await supabase.auth.getUser();

  if(authError)throw authError;
  if(!data.user)throw new Error("पहले Login करें।");

  const {data:validCategory,error:categoryError}=await supabase
   .from("categories")
   .select("id")
   .eq("name",categorySelect.value)
   .eq("is_active",true)
   .maybeSingle();

  if(categoryError)throw categoryError;
  if(!validCategory)throw new Error("यह Category अब Active नहीं है। Refresh करके दूसरी चुनें।");

  let photoUrl=null;

  if(selectedPhoto){

   message.textContent="फोटो Upload हो रही है...";

   const extension=selectedPhoto.name.split(".").pop().toLowerCase();
   const filePath=data.user.id+"/"+crypto.randomUUID()+"."+extension;

   const {data:uploadData,error:uploadError}=await supabase.storage
    .from("machine-photos")
    .upload(filePath,selectedPhoto,{
     contentType:selectedPhoto.type,
     upsert:false
    });

   if(uploadError)throw uploadError;

   uploadedPath=uploadData.path;

   const {data:publicData}=supabase.storage
    .from("machine-photos")
    .getPublicUrl(uploadedPath);

   photoUrl=publicData.publicUrl;
  }

  const row={
   owner_id:data.user.id,
   name:document.getElementById("name").value.trim(),
   category:categorySelect.value,
   description:document.getElementById("description").value.trim(),
   price:Number(document.getElementById("price").value),
   price_unit:document.getElementById("price_unit").value,
   state:document.getElementById("state").value.trim(),
   district:document.getElementById("district").value.trim(),
   tehsil:document.getElementById("tehsil").value.trim(),
   village:document.getElementById("village").value.trim(),
   locality:document.getElementById("locality").value.trim(),
   machine_photo_url:photoUrl,
   latitude:machineLatitude,
   longitude:machineLongitude,
   is_available:true,
   is_active:false,
   availability_status:"available"
  };

  const {error}=await supabase
   .from("machines")
   .insert(row);

  if(error)throw error;

  message.textContent=
   "✅ मशीन सफलतापूर्वक सेव हो गई। Admin की जाँच के बाद लिस्टिंग दिखाई जाएगी।";

  form.reset();
  selectedPhoto=null;
  preview.style.display="none";

  machineLatitude=null;
  machineLongitude=null;

  gpsStatus.textContent="GPS Location अभी प्राप्त नहीं हुई है।";

 }catch(error){

  if(uploadedPath){
   await supabase.storage
    .from("machine-photos")
    .remove([uploadedPath]);
  }

  message.textContent="त्रुटि: "+error.message;

 }finally{

  saveBtn.disabled=!categoriesLoaded;
  gpsBtn.disabled=false;
 }

});

loadCategories();
</script>

</body>
</html>
