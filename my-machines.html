<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JOHAR KISAN - My Machines</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#edf5ed;color:#17351e}
header{background:#176b35;color:white;padding:18px}
main{max-width:700px;margin:auto;padding:14px}
.card{background:white;padding:17px;margin:13px 0;border-radius:14px;box-shadow:0 2px 8px #0001}
button{padding:12px;border:0;border-radius:9px;background:#176b35;color:white;font-size:14px;cursor:pointer}
button:disabled{opacity:.6}
.top{display:flex;gap:8px;flex-wrap:wrap}
.machine{border:1px solid #dce8dc;border-radius:12px;padding:13px;margin:13px 0}
.machine img{width:100%;max-height:190px;object-fit:cover;border-radius:9px}
.machine h3{color:#176b35;margin-bottom:7px}
.muted{color:#647664;font-size:13px}
#message{overflow-wrap:anywhere;color:#176b35}
.danger{background:#a52d2d}
.edit{background:#e0f0df;color:#176b35;font-weight:bold}
.photo-btn{background:#285d9b;margin-top:8px}
</style>
</head>
<body>

<header>
<h2>🌾 JOHAR KISAN</h2>
<p>मेरी मशीनें</p>
</header>

<main>
<div class="card">
<h2>🚜 My Machines</h2>
<div class="top">
<button onclick="location.href='./dashboard.html'">Dashboard</button>
<button onclick="location.href='./add-machine.html'">➕ Add Machine</button>
<button onclick="loadMachines()">Refresh</button>
</div>
<p id="message">मशीनें लोड हो रही हैं...</p>
<div id="machineList"></div>
</div>
</main>

<script type="module">
import {supabase} from "./supabase-config.js";

const message=document.getElementById("message");
const list=document.getElementById("machineList");
let currentUser=null;

async function loadMachines(){
 list.innerHTML="";
 message.textContent="मशीनें लोड हो रही हैं...";

 const {data:authData,error:authError}=await supabase.auth.getUser();

 if(authError||!authData.user){
  location.href="./auth.html";
  return;
 }

 currentUser=authData.user;

 const {data,error}=await supabase
  .from("machines")
  .select("*")
  .eq("owner_id",currentUser.id)
  .order("created_at",{ascending:false});

 if(error){
  message.textContent="त्रुटि: "+error.message;
  return;
 }

 if(!data||data.length===0){
  message.textContent="अभी आपने कोई मशीन नहीं जोड़ी है।";
  return;
 }

 message.textContent="आपकी कुल मशीनें: "+data.length;

 data.forEach(machine=>{
  const card=document.createElement("div");
  card.className="machine";

  const name=document.createElement("h3");
  name.textContent="🚜 "+machine.name;
  card.appendChild(name);

  if(machine.machine_photo_url){
   const img=document.createElement("img");
   img.src=machine.machine_photo_url;
   img.alt="Machine photo";
   img.onerror=()=>img.style.display="none";
   card.appendChild(img);
  }

  const details=[
   "श्रेणी: "+(machine.category||"-"),
   "किराया: ₹"+(machine.price??"-")+" / "+(machine.price_unit||"-"),
   "विवरण: "+(machine.description||"-"),
   "गाँव: "+(machine.village||"-"),
   "तहसील: "+(machine.tehsil||"-"),
   "जिला: "+(machine.district||"-"),
   "राज्य: "+(machine.state||"-"),
   "स्थिति: "+(machine.availability_status||"available"),
   "लिस्टिंग: "+(machine.is_active?"Active":"Admin की मंजूरी बाकी")
  ];

  details.forEach(value=>{
   const p=document.createElement("p");
   p.className="muted";
   p.textContent=value;
   card.appendChild(p);
  });

  // EDIT MACHINE
  const edit=document.createElement("button");
  edit.className="edit";
  edit.textContent="✏️ Edit Machine";
  edit.onclick=()=>editMachine(machine,edit);
  card.appendChild(edit);

  // CHANGE PHOTO
  const photoButton=document.createElement("button");
  photoButton.className="photo-btn";
  photoButton.textContent="📸 Change Photo";
  photoButton.style.marginLeft="8px";

  const fileInput=document.createElement("input");
  fileInput.type="file";
  fileInput.accept="image/jpeg,image/png,image/webp";
  fileInput.style.display="none";

  photoButton.onclick=()=>fileInput.click();

  fileInput.onchange=async()=>{
   const file=fileInput.files?.[0];
   if(!file)return;

   if(!["image/jpeg","image/png","image/webp"].includes(file.type)){
    alert("केवल JPG, PNG या WEBP फोटो चुनें।");
    fileInput.value="";
    return;
   }

   if(file.size>5*1024*1024){
    alert("फोटो का आकार 5 MB से कम होना चाहिए।");
    fileInput.value="";
    return;
   }

   if(!confirm("क्या आप इस मशीन की फोटो बदलना चाहते हैं?")){
    fileInput.value="";
    return;
   }

   photoButton.disabled=true;
   photoButton.textContent="Uploading...";

   const extension=file.type==="image/png"?"png":
    file.type==="image/webp"?"webp":"jpg";

   const filePath=currentUser.id+"/"+machine.id+"-"+Date.now()+"."+extension;

   const {data:uploadData,error:uploadError}=await supabase.storage
    .from("machine-photos")
    .upload(filePath,file,{
     contentType:file.type,
     upsert:false
    });

   if(uploadError){
    alert("फोटो अपलोड नहीं हुई: "+uploadError.message);
    photoButton.disabled=false;
    photoButton.textContent="📸 Change Photo";
    fileInput.value="";
    return;
   }

   const {data:urlData}=supabase.storage
    .from("machine-photos")
    .getPublicUrl(uploadData.path);

   const {error:updateError}=await supabase
    .from("machines")
    .update({machine_photo_url:urlData.publicUrl})
    .eq("id",machine.id)
    .eq("owner_id",currentUser.id);

   if(updateError){
    alert("फोटो अपलोड हुई, लेकिन मशीन में सेव नहीं हुई: "+updateError.message+
    "\nअपलोड की गई फाइल Storage में रह सकती है।");
   }else{
    alert("मशीन की नई फोटो सफलतापूर्वक सेव हो गई।");
    loadMachines();
   }

   photoButton.disabled=false;
   photoButton.textContent="📸 Change Photo";
   fileInput.value="";
  };

  card.appendChild(photoButton);
  card.appendChild(fileInput);

  // DELETE MACHINE
  const del=document.createElement("button");
  del.className="danger";
  del.style.marginTop="10px";
  del.style.marginLeft="8px";
  del.textContent="Delete Machine";

  del.onclick=async()=>{
   if(!confirm("क्या आप इस मशीन को हटाना चाहते हैं?"))return;

   del.disabled=true;

   const {error:deleteError}=await supabase
    .from("machines")
    .delete()
    .eq("id",machine.id)
    .eq("owner_id",currentUser.id);

   if(deleteError){
    alert("Delete नहीं हुआ: "+deleteError.message);
    del.disabled=false;
   }else{
    alert("मशीन हटा दी गई।");
    loadMachines();
   }
  };

  card.appendChild(del);
  list.appendChild(card);
 });
}

async function editMachine(machine,button){

 const ask=(label,value)=>prompt(label,value??"");

 const name=ask("मशीन का नाम:",machine.name);
 if(name===null)return;

 const category=ask("मशीन की श्रेणी:",machine.category);
 if(category===null)return;

 const description=ask("मशीन का विवरण:",machine.description);
 if(description===null)return;

 const price=ask("किराया / कीमत:",machine.price);
 if(price===null)return;

 const priceUnit=ask("कीमत की यूनिट:",machine.price_unit);
 if(priceUnit===null)return;

 const village=ask("गाँव:",machine.village);
 if(village===null)return;

 const tehsil=ask("तहसील:",machine.tehsil);
 if(tehsil===null)return;

 const district=ask("जिला:",machine.district);
 if(district===null)return;

 const state=ask("राज्य:",machine.state);
 if(state===null)return;

 const availability=ask(
  "उपलब्धता: available / booked / maintenance",
  machine.availability_status||"available"
 );
 if(availability===null)return;

 const cleanPrice=Number(price);

 if(!name.trim()||!category.trim()){
  alert("मशीन का नाम और श्रेणी जरूरी है।");
  return;
 }

 if(price.trim()===""||!Number.isFinite(cleanPrice)||cleanPrice<0){
  alert("कृपया सही कीमत डालें।");
  return;
 }

 const allowed=["available","booked","maintenance"];

 if(!allowed.includes(availability.trim().toLowerCase())){
  alert("उपलब्धता available, booked या maintenance होनी चाहिए।");
  return;
 }

 const updated={
  name:name.trim(),
  category:category.trim(),
  description:description.trim(),
  price:cleanPrice,
  price_unit:priceUnit.trim(),
  village:village.trim(),
  tehsil:tehsil.trim(),
  district:district.trim(),
  state:state.trim(),
  availability_status:availability.trim().toLowerCase()
 };

 if(!confirm("क्या आप मशीन की जानकारी अपडेट करना चाहते हैं?"))return;

 button.disabled=true;
 button.textContent="Saving...";

 const {error}=await supabase
  .from("machines")
  .update(updated)
  .eq("id",machine.id)
  .eq("owner_id",currentUser.id);

 button.disabled=false;
 button.textContent="✏️ Edit Machine";

 if(error){
  alert("अपडेट नहीं हुआ: "+error.message);
  return;
 }

 alert("मशीन की जानकारी अपडेट हो गई।");
 loadMachines();
}

loadMachines();
</script>
</body>
</html>
