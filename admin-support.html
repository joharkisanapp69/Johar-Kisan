<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JOHAR KISAN - Admin Support</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#edf5ed;color:#17351e}
header{background:#176b35;color:white;padding:18px}
main{max-width:750px;margin:auto;padding:15px}
.card{background:white;padding:16px;border-radius:13px;margin:13px 0;box-shadow:0 2px 8px #0001}
h2,h3{margin-top:0}
button,select{padding:11px;border-radius:8px;border:1px solid #aaa;font-size:14px}
button{background:#176b35;color:white;border:0;cursor:pointer}
select{width:100%;margin:8px 0}
.ticket{border-left:4px solid #176b35}
small{color:#607360}
.status{font-weight:bold;color:#176b35}
#message{overflow-wrap:anywhere}
</style>
</head>
<body>
<header>
<h2>🛡️ JOHAR KISAN</h2>
<p>Admin Support Dashboard</p>
</header>

<main>
<div class="card">
<h3>किसानों की सहायता रिक्वेस्ट</h3>
<button id="refresh">↻ Refresh Tickets</button>
<p id="message">लोड हो रहा है...</p>
</div>

<div id="tickets"></div>
</main>

<script type="module">
import {supabase} from "./supabase-config.js";

const message=document.getElementById("message");
const ticketsBox=document.getElementById("tickets");

async function checkAdmin(){
 const {data,error}=await supabase.auth.getUser();

 if(error||!data.user){
  location.href="./auth.html";
  return false;
 }

 const {data:profile,error:profileError}=await supabase
 .from("profiles")
 .select("is_admin")
 .eq("id",data.user.id)
 .maybeSingle();

 if(profileError||profile?.is_admin!==true){
  document.body.innerHTML="<h2 style='padding:25px'>Access Denied: केवल Admin के लिए।</h2>";
  return false;
 }

 return true;
}

async function loadTickets(){
 ticketsBox.innerHTML="";
 message.textContent="शिकायतें लोड हो रही हैं...";

 const {data,error}=await supabase
 .from("support_tickets")
 .select("id,user_id,subject,message,status,created_at")
 .order("created_at",{ascending:false});

 if(error){
  message.textContent="Error: "+error.message;
  return;
 }

 if(!data||data.length===0){
  message.textContent="अभी कोई शिकायत उपलब्ध नहीं है।";
  return;
 }

 message.textContent="कुल शिकायतें: "+data.length;

 data.forEach(ticket=>{
  const card=document.createElement("div");
  card.className="card ticket";

  const title=document.createElement("h3");
  title.textContent=ticket.subject;

  const user=document.createElement("small");
  user.textContent="User ID: "+ticket.user_id;

  const date=document.createElement("p");
  date.textContent="तारीख: "+new Date(ticket.created_at).toLocaleString("hi-IN");

  const msg=document.createElement("p");
  msg.textContent=ticket.message;

  const label=document.createElement("label");
  label.textContent="शिकायत का Status";

  const select=document.createElement("select");
  ["pending","in_progress","resolved","rejected"].forEach(status=>{
   const option=document.createElement("option");
   option.value=status;
   option.textContent={
    pending:"Pending - लंबित",
    in_progress:"In Progress - काम चल रहा है",
    resolved:"Resolved - समाधान हो गया",
    rejected:"Rejected - अस्वीकृत"
   }[status];
   if(ticket.status===status)option.selected=true;
   select.appendChild(option);
  });

  const save=document.createElement("button");
  save.textContent="Status सेव करें";

  const result=document.createElement("p");

  save.onclick=async()=>{
   save.disabled=true;
   result.textContent="अपडेट हो रहा है...";

   const {error:updateError}=await supabase
    .from("support_tickets")
    .update({status:select.value})
    .eq("id",ticket.id);

   save.disabled=false;

   if(updateError){
    result.textContent="अपडेट नहीं हुआ: "+updateError.message;
   }else{
    result.textContent="Status अपडेट हो गया।";
   }
  };

  card.append(title,user,date,msg,label,select,save,result);
  ticketsBox.appendChild(card);
 });
}

document.getElementById("refresh").onclick=loadTickets;

if(await checkAdmin()){
 await loadTickets();
}
</script>
</body>
</html>
