<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JOHAR KISAN - Machines</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#edf5ed;color:#17351e}
header{background:#176b35;color:white;padding:18px}
main{max-width:700px;margin:auto;padding:14px}
.card{background:white;padding:15px;border-radius:12px;margin:13px 0;box-shadow:0 2px 8px #0001}
.machine img{width:100%;max-height:220px;object-fit:cover;border-radius:9px}
.machine h3{color:#176b35}
input,select{width:100%;padding:12px;margin:6px 0;border:1px solid #ccd8cc;border-radius:8px;background:white;font-size:15px}
button,.book-button{display:inline-block;padding:12px;border:0;border-radius:8px;background:#176b35;color:white;font-size:14px;text-decoration:none;cursor:pointer;text-align:center}
.reset{background:#647664}
.book-button{display:block;width:100%;margin-top:14px;font-weight:bold;font-size:16px}
.muted{color:#647664;font-size:13px}
.status{background:#eaf5e9;padding:9px;border-radius:8px;font-size:13px}
.filter-label{display:block;margin-top:9px;font-size:13px;font-weight:bold;color:#315c38}
.rating{background:#fff8df;padding:10px;border-radius:8px;margin:10px 0;color:#765500;font-size:14px}
.rating strong{font-size:17px}
.rating-error{background:#fcefed;color:#9a392e}
.reviews-section{border-top:1px solid #dce8dc;margin-top:14px;padding-top:12px}
.reviews-title{font-size:16px;color:#176b35}
.review-item{background:#f5f9f4;border:1px solid #e0e9df;border-radius:9px;padding:11px;margin:9px 0}
.review-stars{color:#d58a00;font-size:18px}
.review-date{font-size:12px;color:#718071;margin-top:5px}
.review-text{font-size:14px;line-height:1.5;overflow-wrap:anywhere}
.no-reviews{font-size:13px;color:#647664}
</style>
</head>

<body>
<header>
<h2>🌾 JOHAR KISAN</h2>
<p>किसानों के लिए मशीनें</p>
</header>

<main>
<div class="card">
<h3>🔍 मशीन खोजें</h3>
<input id="search" placeholder="मशीन का नाम लिखें...">

<label class="filter-label">श्रेणी चुनें</label>
<select id="category">
<option value="">सभी श्रेणियाँ</option>
</select>

<label class="filter-label">राज्य चुनें</label>
<select id="state"><option value="">सभी राज्य</option></select>

<label class="filter-label">जिला चुनें</label>
<select id="district"><option value="">सभी जिले</option></select>

<label class="filter-label">तहसील चुनें</label>
<select id="tehsil"><option value="">सभी तहसील</option></select>

<label class="filter-label">गाँव / स्थानीय क्षेत्र चुनें</label>
<select id="village"><option value="">सभी गाँव और क्षेत्र</option></select>

<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">
<button id="searchBtn">🔍 खोजें</button>
<button id="resetBtn" class="reset">Reset Filters</button>
<button onclick="location.href='./dashboard.html'">Dashboard</button>
</div>

<p id="message">मशीनें लोड हो रही हैं...</p>
</div>

<div id="machineList"></div>
</main>

<script type="module">
import {supabase} from "./supabase-config.js";

const list=document.getElementById("machineList");
const message=document.getElementById("message");
const searchInput=document.getElementById("search");
const categorySelect=document.getElementById("category");
const stateSelect=document.getElementById("state");
const districtSelect=document.getElementById("district");
const tehsilSelect=document.getElementById("tehsil");
const villageSelect=document.getElementById("village");

let allMachines=[];

function clean(value){
 return String(value||"").trim();
}

function uniqueValues(values){
 return [...new Set(values.map(clean).filter(Boolean))]
  .sort((a,b)=>a.localeCompare(b));
}

function fillSelect(select,values,defaultText){
 select.innerHTML="";
 const first=document.createElement("option");
 first.value="";
 first.textContent=defaultText;
 select.appendChild(first);

 uniqueValues(values).forEach(value=>{
  const option=document.createElement("option");
  option.value=value;
  option.textContent=value;
  select.appendChild(option);
 });
}

async function loadCategories(){
 const {data,error}=await supabase
  .from("categories")
  .select("name")
  .eq("is_active",true)
  .order("name");

 if(error){
  console.error("Category loading error:",error.message);
  fillSelect(categorySelect,allMachines.map(m=>m.category),"सभी श्रेणियाँ");
  return;
 }

 fillSelect(categorySelect,(data||[]).map(c=>c.name),"सभी श्रेणियाँ");
}

function loadLocationFilters(){
 fillSelect(stateSelect,allMachines.map(m=>m.state),"सभी राज्य");
 fillSelect(districtSelect,allMachines.map(m=>m.district),"सभी जिले");
 fillSelect(tehsilSelect,allMachines.map(m=>m.tehsil),"सभी तहसील");
 fillSelect(villageSelect,allMachines.flatMap(m=>[m.village,m.locality]),"सभी गाँव और क्षेत्र");
}

// Rating और Public Reviews साथ में लोड करें
async function loadMachineData(machineIds){
 const results=await Promise.all(
  machineIds.map(async id=>{
   const [ratingResult,reviewsResult]=await Promise.all([
    supabase.rpc("get_machine_rating",{
     p_machine_id:id
    }),
    supabase.rpc("get_public_machine_reviews",{
     p_machine_id:id
    })
   ]);

   return {
    id,
    rating:ratingResult.error
     ?{error:true}
     :{data:ratingResult.data?.[0]||null},
    reviews:reviewsResult.error
     ?{error:true}
     :{data:reviewsResult.data||[]}
   };
  })
 );

 return new Map(results.map(item=>[item.id,item]));
}

function createRatingElement(result){
 const rating=document.createElement("div");
 rating.className="rating";

 if(result?.error){
  rating.classList.add("rating-error");
  rating.textContent="⭐ रेटिंग अभी उपलब्ध नहीं है।";
  return rating;
 }

 const ratingData=result?.data;

 if(!ratingData||Number(ratingData.total_reviews)===0){
  rating.textContent="⭐ अभी कोई रिव्यू नहीं";
  return rating;
 }

 const average=Number(ratingData.average_rating||0);
 const total=Number(ratingData.total_reviews||0);

 const strong=document.createElement("strong");
 strong.textContent="⭐ "+average.toFixed(1)+" / 5";
 rating.appendChild(strong);

 const count=document.createElement("span");
 count.textContent=" ("+total+" Reviews)";
 rating.appendChild(count);

 return rating;
}

function formatDate(value){
 const d=new Date(value);
 return Number.isNaN(d.getTime())
  ?"-"
  :d.toLocaleDateString("hi-IN");
}

function createReviewsElement(result){
 const section=document.createElement("div");
 section.className="reviews-section";

 const heading=document.createElement("h4");
 heading.className="reviews-title";
 heading.textContent="📝 ग्राहक Reviews";
 section.appendChild(heading);

 if(result?.error){
  const error=document.createElement("p");
  error.className="no-reviews";
  error.textContent="Reviews अभी लोड नहीं हो पाए।";
  section.appendChild(error);
  return section;
 }

 const reviews=result?.data||[];

 if(reviews.length===0){
  const empty=document.createElement("p");
  empty.className="no-reviews";
  empty.textContent="अभी कोई सार्वजनिक Review उपलब्ध नहीं है।";
  section.appendChild(empty);
  return section;
 }

 reviews.forEach(review=>{
  const item=document.createElement("div");
  item.className="review-item";

  const stars=document.createElement("div");
  stars.className="review-stars";
  const rating=Math.max(0,Math.min(5,Number(review.rating)||0));
  stars.textContent="★".repeat(rating)+"☆".repeat(5-rating);
  item.appendChild(stars);

  const reviewText=document.createElement("p");
  reviewText.className="review-text";
  reviewText.textContent=review.review_text||"ग्राहक ने केवल Rating दी है।";
  item.appendChild(reviewText);

  const date=document.createElement("div");
  date.className="review-date";
  date.textContent="📅 "+formatDate(review.created_at);
  item.appendChild(date);

  section.appendChild(item);
 });

 const footer=document.createElement("p");
 footer.className="no-reviews";
 footer.textContent="केवल हाल के सार्वजनिक Reviews दिखाए गए हैं।";
 section.appendChild(footer);

 return section;
}

function showMachines(items){
 list.innerHTML="";

 if(items.length===0){
  message.textContent="आपकी खोज से कोई Approved मशीन नहीं मिली।";
  return;
 }

 message.textContent="मिली हुई मशीनें: "+items.length;

 // हर कार्ड को मशीन ID से जोड़ें
 const cardsById=new Map();

 items.forEach(m=>{
  const card=document.createElement("div");
  card.className="card machine";
  cardsById.set(m.id,card);

  const title=document.createElement("h3");
  title.textContent="🚜 "+m.name;
  card.appendChild(title);

  if(m.machine_photo_url){
   const img=document.createElement("img");
   img.src=m.machine_photo_url;
   img.alt="Machine photo";
   img.onerror=()=>img.style.display="none";
   card.appendChild(img);
  }

  const ratingBox=document.createElement("div");
  ratingBox.className="rating";
  ratingBox.textContent="⭐ रेटिंग लोड हो रही है...";
  card.appendChild(ratingBox);

  const details=[
   "श्रेणी: "+(m.category||"-"),
   "किराया: ₹"+(m.price??"-")+" / "+(m.price_unit||"-"),
   "गाँव: "+(m.village||"-"),
   "स्थानीय क्षेत्र: "+(m.locality||"-"),
   "तहसील: "+(m.tehsil||"-"),
   "जिला: "+(m.district||"-"),
   "राज्य: "+(m.state||"-"),
   "विवरण: "+(m.description||"-")
  ];

  details.forEach(value=>{
   const p=document.createElement("p");
   p.className="muted";
   p.textContent=value;
   card.appendChild(p);
  });

  const availability=m.availability_status||"available";
  const status=document.createElement("p");
  status.className="status";
  status.textContent="उपलब्धता: "+availability;
  card.appendChild(status);

  if(availability==="available"){
   const book=document.createElement("a");
   book.className="book-button";
   book.textContent="📅 इस मशीन की बुकिंग करें";
   book.href="./book-machine.html?machine_id="+encodeURIComponent(m.id);
   card.appendChild(book);
  }else{
   const unavailable=document.createElement("p");
   unavailable.className="muted";
   unavailable.textContent="यह मशीन अभी बुकिंग के लिए उपलब्ध नहीं है।";
   card.appendChild(unavailable);
  }

  list.appendChild(card);
 });

 const machineIds=items.map(m=>m.id);

 loadMachineData(machineIds).then(results=>{
  // पुरानी खोज के परिणाम नए कार्डों को न बदलें
  items.forEach(m=>{
   const card=cardsById.get(m.id);
   if(!card||!card.isConnected)return;

   const machineData=results.get(m.id);
   if(!machineData)return;

   const oldRating=card.querySelector(".rating");
   if(oldRating){
    oldRating.replaceWith(createRatingElement(machineData.rating));
   }

   card.appendChild(createReviewsElement(machineData.reviews));
  });
 }).catch(error=>{
  console.error("Machine rating/reviews loading error:",error);
 });
}

function searchMachines(){
 const q=searchInput.value.trim().toLowerCase();
 const category=categorySelect.value;
 const state=stateSelect.value;
 const district=districtSelect.value;
 const tehsil=tehsilSelect.value;
 const village=villageSelect.value;

 const filtered=allMachines.filter(m=>{
  const searchable=[
   m.name,m.category,m.village,m.locality,
   m.tehsil,m.district,m.state,m.description
  ].map(clean).join(" ").toLowerCase();

  return (!q||searchable.includes(q)) &&
   (!category||m.category===category) &&
   (!state||m.state===state) &&
   (!district||m.district===district) &&
   (!tehsil||m.tehsil===tehsil) &&
   (!village||m.village===village||m.locality===village);
 });

 showMachines(filtered);
}

function resetFilters(){
 searchInput.value="";
 categorySelect.value="";
 stateSelect.value="";
 districtSelect.value="";
 tehsilSelect.value="";
 villageSelect.value="";
 showMachines(allMachines);
}

async function loadMachines(){
 message.textContent="मशीनें लोड हो रही हैं...";
 list.innerHTML="";

 const {data,error}=await supabase
  .from("machines")
  .select("*")
  .eq("is_active",true)
  .eq("approval_status","approved")
  .order("created_at",{ascending:false});

 if(error){
  message.textContent="त्रुटि: "+error.message;
  return;
 }

 allMachines=data||[];
 await loadCategories();
 loadLocationFilters();
 showMachines(allMachines);
}

document.getElementById("searchBtn").addEventListener("click",searchMachines);
document.getElementById("resetBtn").addEventListener("click",resetFilters);
searchInput.addEventListener("input",searchMachines);
categorySelect.addEventListener("change",searchMachines);
stateSelect.addEventListener("change",searchMachines);
districtSelect.addEventListener("change",searchMachines);
tehsilSelect.addEventListener("change",searchMachines);
villageSelect.addEventListener("change",searchMachines);

loadMachines();
</script>
</body>
</html>
