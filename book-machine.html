<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JOHAR KISAN - Book Machine</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#edf5ed;color:#17351e}
header{background:#176b35;color:white;padding:18px}
main{max-width:600px;margin:auto;padding:15px}
.card{background:white;padding:18px;border-radius:12px;box-shadow:0 2px 8px #0001}
label{display:block;margin-top:13px;font-weight:bold}
input,select,textarea{width:100%;padding:12px;margin-top:6px;border:1px solid #ccd8cc;border-radius:8px;font-size:15px}
button{width:100%;padding:13px;margin-top:18px;border:0;border-radius:8px;background:#176b35;color:white;font-size:16px}
button:disabled{opacity:.6}
#message{overflow-wrap:anywhere;line-height:1.5}
.preview{border:1px solid #dce8dc;border-radius:10px;padding:12px;margin-top:15px;display:none}
.preview img{width:100%;max-height:210px;object-fit:cover;border-radius:8px}
.preview p{font-size:14px;color:#526552}
</style>
</head>
<body>
<header>
<h2>🌾 JOHAR KISAN</h2>
<p>मशीन बुक करें</p>
</header>
<main>
<div class="card">
<h2>🚜 Machine Booking</h2>

<form id="bookingForm">
<label>मशीन चुनें</label>
<select id="machine" required>
<option value="">मशीन चुनें</option>
</select>

<div class="preview" id="machinePreview">
<img id="machinePhoto" alt="Machine photo" style="display:none">
<h3 id="machineName"></h3>
<p id="machinePrice"></p>
<p id="machineLocation"></p>
</div>

<label>काम की तारीख</label>
<input type="date" id="service_date" required>

<label>काम का स्थान</label>
<input id="service_address" required maxlength="300" placeholder="गाँव / खेत का पता">

<label>किसान का संदेश</label>
<textarea id="customer_note" maxlength="1000" placeholder="काम की जानकारी"></textarea>

<button id="submitBtn" type="submit">बुकिंग भेजें</button>
</form>

<p id="message"></p>
<button type="button" onclick="location.href='./machines.html'">मशीनों पर वापस जाएँ</button>
<button type="button" onclick="location.href='./my-bookings.html'">मेरी Booking देखें</button>
</div>
</main>

<script type="module">
import {supabase} from "./supabase-config.js";

const machineSelect=document.getElementById("machine");
const form=document.getElementById("bookingForm");
const message=document.getElementById("message");
const submitBtn=document.getElementById("submitBtn");
const preview=document.getElementById("machinePreview");

let user=null;
let machines=[];

function showMachine(){
 const id=machineSelect.value;
 const m=machines.find(item=>String(item.id)===id);

 if(!m){
  preview.style.display="none";
  return;
 }

 preview.style.display="block";
 document.getElementById("machineName").textContent="🚜 "+m.name;
 document.getElementById("machinePrice").textContent=
  "किराया: ₹"+(m.price??"-")+" / "+(m.price_unit||"-");
 document.getElementById("machineLocation").textContent=
  "स्थान: "+[m.village,m.district,m.state].filter(Boolean).join(", ");

 const photo=document.getElementById("machinePhoto");
 if(m.machine_photo_url){
  photo.src=m.machine_photo_url;
  photo.style.display="block";
  photo.onerror=()=>photo.style.display="none";
 }else{
  photo.removeAttribute("src");
  photo.style.display="none";
 }
}

machineSelect.addEventListener("change",showMachine);

async function start(){
 try{
  const {data:authData,error:authError}=await supabase.auth.getUser();
  if(authError)throw authError;

  if(!authData.user){
   location.href="./auth.html";
   return;
  }
  user=authData.user;

  const {data,error}=await supabase
   .from("machines")
   .select("id,name,owner_id,village,district,state,price,price_unit,machine_photo_url")
   .eq("is_active",true)
   .eq("approval_status","approved")
   .order("name");

  if(error)throw error;

  machines=data||[];

  machines.forEach(m=>{
   const option=document.createElement("option");
   option.value=m.id;
   option.textContent=m.name+" - "+(m.village||m.district||"");
   machineSelect.appendChild(option);
  });

  if(machines.length===0){
   message.textContent="अभी कोई Approved मशीन उपलब्ध नहीं है।";
   submitBtn.disabled=true;
  }

 }catch(error){
  message.textContent="त्रुटि: "+error.message;
 }
}

form.addEventListener("submit",async(e)=>{
 e.preventDefault();
 submitBtn.disabled=true;
 message.textContent="बुकिंग भेजी जा रही है...";

 try{
  if(!user)throw new Error("पहले Login करें।");

  const machine=machines.find(
   m=>String(m.id)===machineSelect.value
  );

  if(!machine)throw new Error("मशीन चुनें।");
  if(machine.owner_id===user.id){
   throw new Error("आप अपनी मशीन खुद बुक नहीं कर सकते।");
  }

  const serviceDate=document.getElementById("service_date").value;
  const serviceAddress=document.getElementById("service_address").value.trim();

  if(!serviceDate||!serviceAddress){
   throw new Error("तारीख और काम का स्थान भरें।");
  }

  const {error}=await supabase.from("bookings").insert({
   machine_id:machine.id,
   machine_name_snapshot:machine.name,
   customer_id:user.id,
   owner_id:machine.owner_id,
   service_date:serviceDate,
   service_address:serviceAddress,
   customer_note:document.getElementById("customer_note").value.trim(),
   status:"pending"
  });

  if(error)throw error;

  message.textContent=
   "✅ आपकी बुकिंग सफलतापूर्वक भेज दी गई है। Owner के जवाब का इंतजार करें।";

  form.reset();
  preview.style.display="none";

 }catch(error){
  message.textContent="त्रुटि: "+error.message;
 }finally{
  submitBtn.disabled=false;
 }
});

start();
</script>
</body>
</html>
